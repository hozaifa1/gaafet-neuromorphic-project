                }
              },
                React.createElement('div', { style: { fontSize: 8, color: "#4fc3f7", letterSpacing: 3, marginBottom: 8 } },
                  "◈ CIRCUIT SCHEMATIC"
                ),
                React.createElement(CircuitDiagram, { phase, animT })
              ),

              // Right panel
              React.createElement('div', { style: { display: "flex", flexDirection: "column", gap: 10 } },

                // GAA cross section
                React.createElement('div', {
                  style: {
                    background: "#070712",
                    border: "1px solid #1a1a3a",
                    borderRadius: 8,
                    padding: 10,
                    display: "flex",
                    flexDirection: "column",
                    alignItems: "center",
                  }
                },
                  React.createElement('div', { style: { fontSize: 8, color: "#4fc3f7", letterSpacing: 3, marginBottom: 8 } },
                    "◈ DEVICE CROSS-SECTION"
                  ),
                  React.createElement(GAASection, { pol: displayPol, phase })
                ),

                // Waveforms
                React.createElement('div', {
                  style: {
                    background: "#070712",
                    border: "1px solid #1a1a3a",
                    borderRadius: 8,
                    padding: 10,
                  }
                },
                  React.createElement('div', { style: { fontSize: 8, color: "#4fc3f7", letterSpacing: 3, marginBottom: 8 } },
                    "◈ REAL-TIME TELEMETRY"
                  ),
                  React.createElement(Waveform, { data: vthHist, color: phase.color, label: "VTH (V)", unit: "V", currentVal: displayVth.toFixed(2) }),
                  React.createElement(Waveform, { data: idsHist, color: phase.color, label: "IDS (μA)", unit: "μA", currentVal: (displayIds * 1000).toFixed(0) }),
                  React.createElement(Waveform, { data: polHist, color: phase.color, label: "ΔP (norm)", unit: "", currentVal: displayPol.toFixed(2) })
                ),

                // Polarization bar
                React.createElement('div', {
                  style: {
                    background: "#070712",
                    border: "1px solid #1a1a3a",
                    borderRadius: 8,
                    padding: 10,
                  }
                },
                  React.createElement(PolarizationBar, { pol: displayPol, color: phase.color })
                ),

                // Controls
                React.createElement('div', {
                  style: {
                    background: "#070712",
                    border: "1px solid #1a1a3a",
                    borderRadius: 8,
                    padding: 10,
                    display: "flex",
                    flexDirection: "column",
                    gap: 8,
                  }
                },
                  React.createElement('div', { style: { fontSize: 8, color: "#4fc3f7", letterSpacing: 3, marginBottom: 4 } },
                    "◈ SIMULATION CONTROLS"
                  ),
                  
                  React.createElement('div', { style: { display: "flex", gap: 8 } },
                    React.createElement('button', {
                      onClick: () => setPlaying(!playing),
                      style: {
                        flex: 1,
                        padding: "8px 12px",
                        background: playing ? phase.color : "#1a1a3a",
                        color: "#fff",
                        border: `1px solid ${phase.color}`,
                        borderRadius: 4,
                        fontFamily: "monospace",
                        fontSize: 10,
                        fontWeight: 700,
                        cursor: "pointer",
                        transition: "all 0.2s",
                      }
                    }, playing ? "⏸ PAUSE" : "▶ PLAY"),
                    
                    React.createElement('button', {
                      onClick: () => {
                        setPlaying(false);
                        setPhaseIdx(0);
                        tRef.current = 0;
                        interpRef.current = { vth: PHASES[0].vth, ids: PHASES[0].ids, pol: PHASES[0].pol };
                        setDisplayVth(PHASES[0].vth);
                        setDisplayIds(PHASES[0].ids);
                        setDisplayPol(PHASES[0].pol);
                      },
                      style: {
                        padding: "8px 12px",
                        background: "#1a1a3a",
                        color: "#4fc3f7",
                        border: "1px solid #4fc3f7",
                        borderRadius: 4,
                        fontFamily: "monospace",
                        fontSize: 10,
                        fontWeight: 700,
                        cursor: "pointer",
                        transition: "all 0.2s",
                      }
                    }, "↺ RESET")
                  ),

                  React.createElement('div', { style: { display: "flex", flexDirection: "column", gap: 4 } },
                    React.createElement('div', { style: { fontSize: 8, color: "#aaa", marginBottom: 2 } }, "PHASE SELECTOR"),
                    React.createElement('div', { style: { display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 4 } },
                      ...PHASES.map((p, i) =>
                        React.createElement('button', {
                          key: p.id,
                          onClick: () => {
                            setPhaseIdx(i);
                            setPlaying(false);
                          },
                          style: {
                            padding: "6px 4px",
                            background: i === phaseIdx ? p.color : "#1a1a3a",
                            color: i === phaseIdx ? "#000" : "#666",
                            border: `1px solid ${i === phaseIdx ? p.color : "#2a2a4a"}`,
                            borderRadius: 3,
                            fontFamily: "monospace",
                            fontSize: 7,
                            fontWeight: 700,
                            cursor: "pointer",
                            transition: "all 0.2s",
                          }
                        }, p.label.split(' ')[0])
                      )
                    )
                  )
                )
              )
            )
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
